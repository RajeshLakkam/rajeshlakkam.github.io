<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajesh Lakkam — Software Engineer</title>
<meta name="description" content="Portfolio and personal site of Rajesh Lakkam, software engineer.">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="header-left">
      <span class="status-dot" aria-hidden="true"></span>
      <a href="#panel-about" class="site-mark" id="siteMark">Rajesh Lakkam</a>
    </div>
    <button class="nav-toggle" id="navToggle" type="button"
            aria-expanded="false" aria-controls="headerNav" aria-label="Menu">
      <span class="nav-toggle-bars" aria-hidden="true"></span>
    </button>

    <div class="header-right" id="headerNav">
      <nav class="tabs" aria-label="Site sections">
        <a href="#panel-about" data-nav="about" aria-current="true">About</a>
        <a href="#panel-projects" data-nav="projects">Projects</a>
        <a href="#panel-hobbies" data-nav="hobbies">Hobbies &amp; Learning</a>
        <a href="#panel-contact" data-nav="contact">Contact</a>
        <span class="tab-indicator" id="tabIndicator" aria-hidden="true"></span>
      </nav>
      <button class="nav-blogs" id="navBlogs" type="button">Blogs</button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- ABOUT -->
  <section id="panel-about" class="panel-section" aria-label="About">
    <div class="hero">
      <div>
        <h1 class="hero-name" id="heroName">Rajesh Lakkam</h1>
        <p class="role" id="heroRole">software engineer</p>
        <p class="tagline" id="heroTagline"></p>
      </div>
      <div class="readout" id="readout" tabindex="0">
        <img class="readout-portrait" id="readoutPortrait" src="assets/portrait.jpg" alt="Portrait of Rajesh Lakkam">
        <dl>
          <dt>location</dt>
          <dd id="metaLocation"></dd>
          <dt>status</dt>
          <dd id="metaStatus"></dd>
          <dt>contact</dt>
          <dd><a id="metaEmail" href="#"></a></dd>
          <dt>elsewhere</dt>
          <dd><ul id="metaLinks"></ul></dd>
        </dl>
      </div>
    </div>

    <div class="origin" id="originText"></div>

    <h2 class="section-heading" style="margin-top:3.5rem;">Skills</h2>
    <div class="skills-grid" id="skillsGrid"></div>
  </section>

  <!-- PROJECTS -->
  <section id="panel-projects" class="panel-section" aria-label="Projects">
    <h2 class="section-heading">Projects</h2>
    <div id="projectsList"></div>
  </section>

  <!-- HOBBIES -->
  <section id="panel-hobbies" class="panel-section" aria-label="Hobbies and learning">
    <h2 class="section-heading">Hobbies &amp; things I'm learning</h2>
    <div class="hobbies-grid" id="hobbiesGrid"></div>
  </section>

  <!-- CONTACT -->
  <section id="panel-contact" class="panel-section" aria-label="Contact">
    <h2 class="section-heading">Contact</h2>
    <div class="contact">
      <p id="contactLine"></p>
      <div class="contact-links" id="contactLinks"></div>
    </div>
  </section>

</main>

<footer class="wrap">
  <span id="footerNote">Built with plain HTML, CSS, and JS — hosted on GitHub Pages.</span>
</footer>

<blog-drawer></blog-drawer>

<script src="data.js"></script>
<script src="script.js"></script>
<script src="blog-drawer.js"></script>
</body>
</html>
