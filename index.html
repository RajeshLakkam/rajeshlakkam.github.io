<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex Rivera — Software Engineer</title>
<meta name="description" content="Portfolio and personal site of Alex Rivera, software engineer.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="header-left">
      <span class="status-dot" aria-hidden="true"></span>
      <a href="#about" class="site-mark" id="siteMark">Alex Rivera</a>
    </div>
    <div class="header-right">
      <span class="clock" id="clock" aria-label="Local time"></span>
      <nav class="tabs" role="tablist" aria-label="Site sections">
        <button role="tab" data-tab="about" aria-selected="true">About</button>
        <button role="tab" data-tab="projects" aria-selected="false">Projects</button>
        <button role="tab" data-tab="hobbies" aria-selected="false">Hobbies &amp; Learning</button>
        <button role="tab" data-tab="contact" aria-selected="false">Contact</button>
        <span class="tab-indicator" id="tabIndicator" aria-hidden="true"></span>
      </nav>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- ABOUT -->
  <section id="panel-about" class="panel-section" role="tabpanel">
    <div class="hero">
      <div>
        <h1 class="hero-name" id="heroName">Alex Rivera</h1>
        <p class="role" id="heroRole">software engineer</p>
        <p class="tagline" id="heroTagline"></p>
      </div>
      <dl class="readout">
        <dt>location</dt>
        <dd id="metaLocation"></dd>
        <dt>status</dt>
        <dd id="metaStatus"></dd>
        <dt>contact</dt>
        <dd><a id="metaEmail" href="#"></a></dd>
        <dt>elsewhere</dt>
        <dd><ul id="metaLinks"></ul></dd>
      </dl>
    </div>

    <div class="origin" id="originText"></div>

    <h2 class="section-heading" style="margin-top:3.5rem;">Skills</h2>
    <div class="skills-grid" id="skillsGrid"></div>
  </section>

  <!-- PROJECTS -->
  <section id="panel-projects" class="panel-section" role="tabpanel">
    <h2 class="section-heading">Projects</h2>
    <div id="projectsList"></div>
  </section>

  <!-- HOBBIES -->
  <section id="panel-hobbies" class="panel-section" role="tabpanel">
    <h2 class="section-heading">Hobbies &amp; things I'm learning</h2>
    <div class="hobbies-grid" id="hobbiesGrid"></div>
  </section>

  <!-- CONTACT -->
  <section id="panel-contact" class="panel-section" role="tabpanel">
    <h2 class="section-heading">Contact</h2>
    <div class="contact">
      <p id="contactLine"></p>
      <div class="contact-links" id="contactLinks"></div>
    </div>
  </section>

</main>

<footer class="wrap">
  <span id="footerNote">Built with plain HTML, CSS, and JS — hosted on GitHub Pages.</span>
</footer>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
